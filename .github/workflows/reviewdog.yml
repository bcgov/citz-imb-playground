name: Code Review with ReviewDog

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  reviewdog:
    name: ReviewDog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Run ESLint with ReviewDog
      - name: Run ESLint with ReviewDog
        uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          eslint_flags: '.'
          fail_on_error: false

      # TypeScript check with ReviewDog
      - name: Run TypeScript check
        uses: reviewdog/action-tsc@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_on_error: false

      # Security check with ReviewDog
      - name: Run security check
        uses: reviewdog/action-detect-secrets@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_on_error: false

      # Additional code suggestions with ReviewDog suggester
      - name: Suggest code improvements
        uses: reviewdog/action-suggester@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tool_name: suggester
          level: warning
          filter_mode: added
          reporter: github-pr-review
          fail_on_error: false